<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0e1014">
  <title>tools.aaris.tech</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62.5..125,100..900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    .container { max-width: 1100px; }

    .index-head { margin-bottom: 36px; }
    .index-meta {
      display: flex; gap: 16px; flex-wrap: wrap;
      margin-top: 10px;
    }
    .index-head .rule { margin-top: 22px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    .card {
      display: flex; flex-direction: column;
      padding: 20px;
      background: var(--bg-raise);
      border: 1px solid var(--line);
      text-decoration: none;
      color: inherit;
      transition: border-color var(--dur-fast) var(--ease-out),
                  background var(--dur-fast) var(--ease-out);
      animation: fadeIn 0.4s var(--ease-out) both;
    }
    .card:hover { border-color: var(--accent); }

    .card-top {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 14px;
    }
    .card-icon {
      font-size: 20px; line-height: 1;
      filter: grayscale(1); opacity: .7;
      transition: filter var(--dur-fast), opacity var(--dur-fast);
    }
    .card:hover .card-icon { filter: none; opacity: 1; }
    .card-index {
      font-family: var(--font-mono);
      font-size: 10px; letter-spacing: .1em;
      color: var(--dim);
    }
    .card:hover .card-index { color: var(--accent); }

    .card-name {
      font-weight: 800;
      font-stretch: 110%;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: .01em;
      margin-bottom: 6px;
    }
    .card-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.55;
      flex: 1;
    }
    .card-foot {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 16px;
    }
    .card-open {
      font-family: var(--font-mono);
      font-size: 10px; letter-spacing: .12em;
      color: var(--dim);
      transition: color var(--dur-fast), transform var(--dur-fast) var(--ease-out);
    }
    .card:hover .card-open { color: var(--accent); transform: translateX(3px); }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 72px 20px;
      border: 1px dashed var(--line);
      color: var(--dim);
      font-family: var(--font-mono);
      font-size: 13px;
    }
    .empty code {
      display: inline-block;
      margin-top: 12px;
      padding: 8px 14px;
      border: 1px solid var(--line);
      background: var(--bg-raise);
      font-size: 12px;
      color: var(--muted);
    }

    footer {
      margin-top: 56px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      display: flex; gap: 16px; flex-wrap: wrap; justify-content: space-between;
    }
  </style>
</head>
<body>
  <nav class="topbar">
    <a href="/" class="topbar-brand">TOOLS.AARIS.TECH</a>
    <span class="topbar-path">/ INDEX</span>
    <span class="topbar-right">
      <span id="clock"></span>
      <span class="led led-ok" aria-hidden="true"></span>OPERATIONAL
    </span>
  </nav>

  <div class="container">
    <header class="index-head">
      <div class="tool-kicker">01 / TOOL INDEX</div>
      <h1>Toolbox</h1>
      <div class="index-meta">
        <span class="meta">SELF-HOSTED UTILITIES</span>
        <span class="meta">NO SIGN-UP</span>
        <span class="meta" id="toolCount"></span>
      </div>
      <div class="rule"></div>
    </header>

    <div id="grid" class="grid"></div>

    <footer>
      <span class="meta">TOOLS.AARIS.TECH · SELF-HOSTED</span>
      <span class="meta">ALL PACKETS ACCEPTED</span>
    </footer>
  </div>

  <script>
    async function loadTools() {
      const grid = document.getElementById('grid');
      try {
        const [manifestRes, disabledRes] = await Promise.all([
          fetch('/manifest.json'),
          fetch('/api/admin/disabled-tools').catch(() => ({ ok: false })),
        ]);
        let tools = await manifestRes.json();

        // Filter out disabled tools
        if (disabledRes.ok) {
          const { disabled } = await disabledRes.json();
          const disabledSet = new Set(disabled || []);
          tools = tools.filter(t => !disabledSet.has(t.slug));
        }

        if (!tools.length) {
          grid.innerHTML = `
            <div class="empty">
              <p>NO TOOLS REGISTERED</p>
              <code>tools/my-tool/meta.json + index.html</code>
            </div>`;
          return;
        }

        // Sort by order (lower = first), then alphabetically
        tools.sort((a, b) => (a.order ?? 99) - (b.order ?? 99) || a.name.localeCompare(b.name));

        document.getElementById('toolCount').textContent = tools.length + ' TOOLS ONLINE';

        grid.innerHTML = tools.map((tool, i) => `
          <a href="/tools/${tool.slug}/" class="card" style="animation-delay:${i * 50}ms">
            <div class="card-top">
              <span class="card-icon" aria-hidden="true">${tool.icon || '🔧'}</span>
              <span class="card-index">${String(i + 1).padStart(2, '0')}</span>
            </div>
            <div class="card-name">${tool.name}</div>
            <div class="card-desc">${tool.description || ''}</div>
            <div class="card-foot">
              ${tool.tag ? `<span class="tag">${tool.tag}</span>` : '<span></span>'}
              <span class="card-open">OPEN →</span>
            </div>
          </a>
        `).join('');
      } catch (e) {
        grid.innerHTML = `<div class="empty"><p>FAILED TO LOAD TOOL INDEX</p></div>`;
      }
    }

    function tickClock() {
      const d = new Date();
      const p = n => String(n).padStart(2, '0');
      document.getElementById('clock').textContent =
        p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
    }
    tickClock();
    setInterval(tickClock, 1000);

    loadTools();
  </script>
</body>
</html>
