<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How to Add Tools – tools.aaris.tech</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62.5..125,100..900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
  <style>
    .container { max-width: 800px; }

    .copy-bar { position: sticky; top: 64px; z-index: 10; margin-bottom: 32px; }
    .btn-copy { width: 100%; padding: 16px; }
    .btn-copy.copied { background: var(--ok); border-color: var(--ok); }

    .loading {
      text-align: center; padding: 60px;
      color: var(--dim); font-family: var(--font-mono); font-size: 13px;
    }

    .guide {
      background: var(--bg-raise);
      border: 1px solid var(--line);
      padding: 36px 32px;
      line-height: 1.7;
    }
    .guide h1 {
      font-size: 24px; font-weight: 800; font-stretch: 110%;
      color: var(--ink); margin: 48px 0 16px; letter-spacing: -0.01em;
    }
    .guide h1:first-child { margin-top: 0; }
    .guide h2 { font-size: 19px; font-weight: 700; text-transform: none; font-stretch: 100%; color: var(--ink); margin: 40px 0 14px; }
    .guide h3 { font-size: 16px; font-weight: 700; text-transform: none; font-stretch: 100%; color: var(--ink); margin: 28px 0 10px; }
    .guide h4 { font-size: 14px; font-weight: 700; color: var(--muted); margin: 20px 0 8px; }
    .guide p { color: var(--muted); margin: 0 0 14px; font-size: 14px; }
    .guide strong { color: var(--ink); font-weight: 600; }
    .guide em { color: var(--muted); font-style: italic; }
    .guide a { color: var(--accent); text-decoration: none; }
    .guide a:hover { text-decoration: underline; }
    .guide hr { border: none; border-top: 1px solid var(--line); margin: 32px 0; }
    .guide ul, .guide ol { padding-left: 24px; margin: 0 0 14px; color: var(--muted); }
    .guide li { margin-bottom: 6px; font-size: 14px; }
    .guide code {
      font-family: var(--font-mono); font-size: 12.5px;
      background: var(--bg-input); border: 1px solid var(--line-soft);
      padding: 2px 6px; color: var(--accent-hover);
    }
    .guide pre {
      background: var(--bg-input); border: 1px solid var(--line);
      padding: 16px 18px; margin: 0 0 16px;
      overflow-x: auto;
    }
    .guide pre code {
      background: none; border: none; padding: 0;
      font-size: 12.5px; line-height: 1.6; color: var(--muted);
    }
    .guide table { width: 100%; border-collapse: collapse; margin: 0 0 16px; font-size: 13px; }
    .guide th {
      text-align: left; padding: 10px 14px; font-weight: 600; color: var(--muted);
      border-bottom: 1px solid var(--line);
      font-family: var(--font-mono); font-size: 11px;
      letter-spacing: .05em; text-transform: uppercase;
    }
    .guide td {
      padding: 10px 14px; border-bottom: 1px solid var(--line-soft);
      color: var(--muted);
    }
    .guide td code, .guide th code { font-size: 11.5px; }
  </style>
</head>
<body>
  <nav class="topbar">
    <a href="/" class="topbar-brand">TOOLS.AARIS.TECH</a>
    <span class="topbar-path">/ TOOLS / ADD-TOOL-GUIDE</span>
    <span class="topbar-right"><span class="led led-ok" aria-hidden="true"></span>DOCS / MD</span>
  </nav>

  <div class="container">
    <header class="tool-head">
      <div class="tool-kicker">01 / META</div>
      <h1 class="page-title">How to Add Tools</h1>
      <p class="subtitle">Copy this guide and paste it into any AI model to have it build a new tool.</p>
      <div class="rule"></div>
    </header>

    <div class="copy-bar">
      <button class="btn-copy" id="copyBtn" onclick="copyGuide()">Copy entire guide to clipboard</button>
    </div>

    <div class="guide" id="guide">
      <div class="loading">Loading guide...</div>
    </div>
  </div>

  <script>
    let guideMarkdown = '';

    async function loadGuide() {
      try {
        const res = await fetch('./guide.md');
        guideMarkdown = await res.text();
        document.getElementById('guide').innerHTML = marked.parse(guideMarkdown);
      } catch (e) {
        document.getElementById('guide').innerHTML = '<p style="color:#f87171">Failed to load guide.md</p>';
      }
    }

    function copyGuide() {
      if (!guideMarkdown) return;
      const btn = document.getElementById('copyBtn');
      navigator.clipboard.writeText(guideMarkdown).then(function() {
        btn.textContent = '\u2713 Copied!';
        btn.classList.add('copied');
        setTimeout(function() {
          btn.textContent = 'Copy entire guide to clipboard';
          btn.classList.remove('copied');
        }, 2500);
      });
    }

    loadGuide();
  </script>
</body>
</html>
