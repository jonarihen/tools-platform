<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Formatter – tools.aaris.tech</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62.5..125,100..900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <style>
    .container { max-width: 800px; }

    textarea {
      min-height: 320px;
      padding: 16px;
      font-family: var(--font-mono);
      font-size: 13px;
      tab-size: 2;
    }

    .stats {
      display: flex; gap: 16px; justify-content: flex-end;
      font-family: var(--font-mono); font-size: 11px;
      letter-spacing: .06em; color: var(--dim);
      margin: 8px 0 20px;
    }

    .indent-control {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 14px;
    }
    .indent-control span {
      font-family: var(--font-mono); font-size: 11px;
      letter-spacing: .08em; text-transform: uppercase;
      color: var(--muted);
    }
    .indent-control select { width: auto; padding: 8px 34px 8px 12px; font-size: 13px; }

    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .actions button { flex: 1; }
  </style>
</head>
<body>
  <nav class="topbar">
    <a href="/" class="topbar-brand">TOOLS.AARIS.TECH</a>
    <span class="topbar-path">/ TOOLS / JSON-FORMATTER</span>
    <span class="topbar-right"><span class="led led-ok" aria-hidden="true"></span>OPERATIONAL</span>
  </nav>

  <div class="container">
    <header class="tool-head">
      <div class="tool-kicker">01 / DEV</div>
      <h1>JSON Formatter</h1>
      <p class="subtitle">Paste messy JSON — get it validated and pretty-printed. Runs entirely in your browser.</p>
      <div class="rule"></div>
    </header>

    <div class="indent-control">
      <span>Indent:</span>
      <select id="indent">
        <option value="2" selected>2 spaces</option>
        <option value="4">4 spaces</option>
        <option value="tab">Tab</option>
      </select>
    </div>

    <div class="editor-wrap">
      <textarea id="input" placeholder="Paste your JSON here..." spellcheck="false"></textarea>
    </div>

    <div class="stats">
      <span id="charCount">0 chars</span>
      <span id="lineCount">0 lines</span>
    </div>

    <div class="actions">
      <button class="btn-primary" onclick="formatJSON()">Format</button>
      <button class="btn-secondary" onclick="minifyJSON()">Minify</button>
      <button class="btn-secondary" onclick="copyJSON()">Copy</button>
      <button class="btn-secondary" onclick="clearJSON()">Clear</button>
    </div>

    <div id="status"></div>
  </div>

  <script>
    const input = document.getElementById('input');
    const statusEl = document.getElementById('status');
    const charCount = document.getElementById('charCount');
    const lineCount = document.getElementById('lineCount');
    const indentSelect = document.getElementById('indent');

    function getIndent() {
      const val = indentSelect.value;
      return val === 'tab' ? '\t' : parseInt(val);
    }

    function updateStats() {
      const val = input.value;
      charCount.textContent = val.length.toLocaleString() + ' chars';
      lineCount.textContent = (val ? val.split('\n').length : 0).toLocaleString() + ' lines';
    }

    function showStatus(msg, type) {
      statusEl.className = 'status ' + type;
      statusEl.textContent = msg;
      if (type === 'ok' || type === 'info') {
        setTimeout(() => { statusEl.textContent = ''; statusEl.className = ''; }, 3000);
      }
    }

    function formatJSON() {
      if (!input.value.trim()) return;
      try {
        const parsed = JSON.parse(input.value);
        input.value = JSON.stringify(parsed, null, getIndent());
        updateStats();
        const keys = typeof parsed === 'object' && parsed !== null
          ? (Array.isArray(parsed) ? parsed.length + ' items' : Object.keys(parsed).length + ' keys')
          : typeof parsed;
        showStatus('✓ Valid JSON — ' + keys, 'ok');
      } catch (e) {
        const match = e.message.match(/position (\d+)/);
        if (match) {
          const pos = parseInt(match[1]);
          input.setSelectionRange(pos, pos + 1);
          input.focus();
        }
        showStatus('✗ ' + e.message, 'error');
      }
    }

    function minifyJSON() {
      if (!input.value.trim()) return;
      try {
        const parsed = JSON.parse(input.value);
        input.value = JSON.stringify(parsed);
        updateStats();
        showStatus('✓ Minified — ' + input.value.length.toLocaleString() + ' chars', 'ok');
      } catch (e) {
        showStatus('✗ ' + e.message, 'error');
      }
    }

    function copyJSON() {
      if (!input.value.trim()) return;
      navigator.clipboard?.writeText(input.value).then(() => {
        showStatus('✓ Copied to clipboard', 'info');
      });
    }

    function clearJSON() {
      input.value = '';
      statusEl.textContent = '';
      statusEl.className = '';
      updateStats();
      input.focus();
    }

    // Handle tab key in textarea
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = input.selectionStart;
        const end = input.selectionEnd;
        input.value = input.value.substring(0, start) + '  ' + input.value.substring(end);
        input.selectionStart = input.selectionEnd = start + 2;
      }
      // Ctrl/Cmd + Enter to format
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        formatJSON();
      }
    });

    input.addEventListener('input', updateStats);
    updateStats();
  </script>
<script src="/track.js"></script>
</body>
</html>
