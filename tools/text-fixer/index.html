<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Fixer – tools.aaris.tech</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62.5..125,100..900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <style>
    .container { max-width: 800px; }

    .badge-row { margin-top: 14px; }

    label { display: block; margin-bottom: 8px; }

    textarea { min-height: 200px; padding: 16px; line-height: 1.7; }

    .stats {
      display: flex; gap: 16px; justify-content: flex-end;
      font-family: var(--font-mono); font-size: 11px;
      letter-spacing: .06em; color: var(--dim);
      margin: 8px 0 22px;
    }

    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .actions button { flex: 1; }

    .output-section { margin-top: 20px; }
    .output-header { display: flex; gap: 8px; margin-bottom: 12px; }

    .tab {
      padding: 8px 16px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      font-family: var(--font-mono); font-size: 11px;
      letter-spacing: .1em; text-transform: uppercase;
      cursor: pointer;
      transition: border-color var(--dur-fast), color var(--dur-fast);
    }
    .tab:hover { border-color: var(--accent); color: var(--ink); }
    .tab.active {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }

    .output-box {
      width: 100%; min-height: 200px; padding: 16px;
      background: var(--bg-raise);
      border: 1px solid var(--line);
      font-size: 14px; line-height: 1.7;
      white-space: pre-wrap; word-wrap: break-word;
    }

    .diff-add    { background: var(--ok-dim); color: var(--ok); padding: 0 2px; }
    .diff-remove { background: var(--danger-dim); color: var(--danger); text-decoration: line-through; padding: 0 2px; }
  </style>
</head>
<body>
  <nav class="topbar">
    <a href="/" class="topbar-brand">TOOLS.AARIS.TECH</a>
    <span class="topbar-path">/ TOOLS / TEXT-FIXER</span>
    <span class="topbar-right"><span class="led led-ok" aria-hidden="true"></span>OPERATIONAL</span>
  </nav>

  <div class="container">
    <header class="tool-head">
      <div class="tool-kicker">01 / AI</div>
      <h1>Text Fixer</h1>
      <p class="subtitle">Fix spelling and grammar with a self-hosted model — text is processed on local hardware, not a third-party cloud.</p>
      <div class="badge-row"><span class="badge">LLAMA 3.1 · SELF-HOSTED · MAX 10,000 CHARS</span></div>
      <div class="rule"></div>
    </header>

    <label for="input">Your text</label>
    <div class="editor-wrap">
      <textarea id="input" placeholder="Paste or type your text here..." spellcheck="false"></textarea>
    </div>
    <div class="stats">
      <span id="wordCount">0 words</span>
      <span id="charCount">0 chars</span>
    </div>

    <div class="actions">
      <button class="btn-primary" id="fixBtn" onclick="fixText()">Fix Text</button>
      <button class="btn-secondary" onclick="copyOutput()">Copy</button>
      <button class="btn-secondary" onclick="clearAll()">Clear</button>
    </div>

    <div id="status"></div>

    <div class="output-section" id="outputSection" style="display:none;">
      <div class="output-header">
        <button class="tab active" id="tabCorrected" onclick="showTab('corrected')">Corrected</button>
        <button class="tab" id="tabChanges" onclick="showTab('changes')">Show Changes</button>
      </div>
      <div class="output-box" id="outputCorrected"></div>
      <div class="output-box" id="outputChanges" style="display:none;"></div>
    </div>
  </div>

  <script>
    const input = document.getElementById('input');
    const fixBtn = document.getElementById('fixBtn');
    const statusEl = document.getElementById('status');
    const outputSection = document.getElementById('outputSection');
    const outputCorrected = document.getElementById('outputCorrected');
    const outputChanges = document.getElementById('outputChanges');
    const charCount = document.getElementById('charCount');
    const wordCount = document.getElementById('wordCount');

    let originalText = '';
    let correctedText = '';

    function updateStats() {
      const val = input.value;
      charCount.textContent = val.length.toLocaleString() + ' chars';
      const words = val.trim() ? val.trim().split(/\s+/).length : 0;
      wordCount.textContent = words.toLocaleString() + ' words';
    }

    function showStatus(msg, type) {
      statusEl.className = 'status ' + type;
      statusEl.innerHTML = msg;
      if (type === 'ok') {
        setTimeout(() => { statusEl.textContent = ''; statusEl.className = ''; }, 4000);
      }
    }

    function clearStatus() {
      statusEl.textContent = '';
      statusEl.className = '';
    }

    function showTab(tab) {
      document.getElementById('tabCorrected').classList.toggle('active', tab === 'corrected');
      document.getElementById('tabChanges').classList.toggle('active', tab === 'changes');
      outputCorrected.style.display = tab === 'corrected' ? '' : 'none';
      outputChanges.style.display = tab === 'changes' ? '' : 'none';
    }

    async function fixText() {
      const text = input.value.trim();
      if (!text) return;
      if (text.length > 10000) {
        showStatus('Text is too long — max 10,000 characters', 'error');
        return;
      }

      fixBtn.disabled = true;
      fixBtn.innerHTML = '<span class="spinner"></span>Fixing...';
      outputSection.style.display = 'none';
      outputCorrected.textContent = '';
      outputChanges.innerHTML = '';
      clearStatus();

      try {
        const response = await fetch('/api/fix-text', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });

        if (!response.ok) {
          const err = await response.json().catch(() => ({ error: 'Request failed' }));
          throw new Error(err.error || 'Request failed');
        }

        outputSection.style.display = '';
        showTab('corrected');
        originalText = text;
        correctedText = '';

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const payload = line.slice(6);
            if (payload === '[DONE]') break;
            try {
              const chunk = JSON.parse(payload);
              if (chunk.token) {
                correctedText += chunk.token;
                outputCorrected.textContent = correctedText;
              }
              if (chunk.error) {
                throw new Error(chunk.error);
              }
            } catch (e) {
              if (e.message && !e.message.includes('JSON')) throw e;
            }
          }
        }

        correctedText = correctedText.trim();
        outputCorrected.textContent = correctedText;
        renderDiff();
        showStatus('Done — text has been fixed', 'ok');

      } catch (e) {
        showStatus(e.message || 'Something went wrong', 'error');
      } finally {
        fixBtn.disabled = false;
        fixBtn.textContent = 'Fix Text';
      }
    }

    function renderDiff() {
      const oldWords = originalText.split(/(\s+)/);
      const newWords = correctedText.split(/(\s+)/);

      // Simple LCS-based word diff
      const m = oldWords.length, n = newWords.length;
      // For very long texts, fall back to simple display
      if (m * n > 250000) {
        outputChanges.innerHTML = '<span class="diff-remove">' + escHtml(originalText) + '</span><br><br>' +
                                  '<span class="diff-add">' + escHtml(correctedText) + '</span>';
        return;
      }

      const dp = Array.from({ length: m + 1 }, () => new Uint16Array(n + 1));
      for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
          dp[i][j] = oldWords[i - 1] === newWords[j - 1]
            ? dp[i - 1][j - 1] + 1
            : Math.max(dp[i - 1][j], dp[i][j - 1]);
        }
      }

      const result = [];
      let i = m, j = n;
      while (i > 0 || j > 0) {
        if (i > 0 && j > 0 && oldWords[i - 1] === newWords[j - 1]) {
          result.push(escHtml(oldWords[i - 1]));
          i--; j--;
        } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
          result.push('<span class="diff-add">' + escHtml(newWords[j - 1]) + '</span>');
          j--;
        } else {
          result.push('<span class="diff-remove">' + escHtml(oldWords[i - 1]) + '</span>');
          i--;
        }
      }
      outputChanges.innerHTML = result.reverse().join('');
    }

    function escHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function copyOutput() {
      const text = correctedText || input.value;
      if (!text.trim()) return;
      navigator.clipboard?.writeText(text).then(() => {
        showStatus('Copied to clipboard', 'info');
      });
    }

    function clearAll() {
      input.value = '';
      outputSection.style.display = 'none';
      outputCorrected.textContent = '';
      outputChanges.innerHTML = '';
      originalText = '';
      correctedText = '';
      clearStatus();
      updateStats();
      input.focus();
    }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        fixText();
      }
    });

    input.addEventListener('input', updateStats);
    updateStats();
  </script>
<script src="/track.js"></script>
</body>
</html>
